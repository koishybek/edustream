name: edustream
description: EduStream — ESG & sustainability education (student app).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2

  # Networking & storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Media (lesson player — Phase 3)
  video_player: ^2.9.2
  chewie: ^1.8.5

  # i18n & type
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # i18n codegen is enabled in Phase 1 (when the locale switcher + ARB wiring
  # lands, incl. resolving the KZ locale code). Keeping it off here lets the
  # Phase 0 placeholder `flutter run` with zero gen_l10n surprises.
  generate: false
